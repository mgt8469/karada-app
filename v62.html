<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カラダ">
<title>カラダ管理</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --ink:#1b2026; --sub:#6b727c;
    --line:#e2e7ec; --accent:#c6f24e; --accentD:#4f7a09; --accent2:#df6f0e;
    --warn:#e5484d; --shadow:0 1px 3px rgba(20,30,50,.07);
    --card2:#eef1f5; --chip:#e7ecf1; --navbg:#ffffff;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    padding-bottom:80px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.01em}
  header h1 span{color:var(--accentD)}
  .gear{background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub);padding:4px}
  h2{font-size:16px;margin:18px 0 8px;font-weight:800}
  h3{font-size:13px;margin:14px 0 6px;color:var(--sub);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
  .muted{color:var(--sub);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:13px;color:var(--sub);display:block;margin:8px 0 3px}
  input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:var(--card2);color:var(--ink)}
  textarea{resize:vertical;min-height:52px}
  input[type=checkbox]{width:auto}
  .btn{background:var(--accent);color:#16181c;border:none;border-radius:12px;padding:14px;
    font-size:16px;font-weight:800;cursor:pointer;width:100%}
  .btn.sm{width:auto;padding:9px 13px;font-size:14px;border-radius:10px}
  .btn.ghost{background:transparent;color:var(--accentD);border:1.5px solid var(--accent)}
  .btn.gray{background:var(--chip);color:var(--ink)}
  .btn.warn{background:var(--warn);color:#16181c}
  .chip{display:inline-block;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--card2);font-size:14px;cursor:pointer;margin:0 6px 6px 0;color:var(--ink)}
  .chip.on{background:var(--accent);color:#16181c;border-color:var(--accentD);font-weight:700}
  .chip.tag.on{background:var(--accent2);border-color:var(--accent2);color:#16181c}
  .subtabs{display:flex;gap:6px;margin:6px 0 10px}
  .subtabs button{flex:1;padding:11px;border:1px solid var(--line);background:var(--card2);border-radius:10px;
    font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
  .subtabs button.on{background:var(--accent);color:#16181c;border-color:var(--accentD)}
  .item{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
  .item:last-child{border-bottom:none}
  .item .d{font-size:12px;color:var(--sub)}
  .flex2{display:flex;gap:8px}.flex2>*{flex:1}
  .flex3{display:flex;gap:6px}.flex3>*{flex:1}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--navbg);border-top:1px solid var(--line);
    display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;padding:10px 0 9px;font-size:10px;color:var(--sub);cursor:pointer;font-weight:600}
  nav button .ic{display:block;margin-bottom:3px}
  nav button.on{color:var(--accentD)}
  .nic{width:24px;height:24px;margin:0 auto;display:block}
  .gearic{width:24px;height:24px;display:block}
  #sessbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 56px);z-index:29;
    max-width:520px;margin:0 auto;background:var(--card);border-top:2px solid var(--accent);
    box-shadow:0 -6px 18px rgba(0,0,0,.35);padding:9px 14px;display:none}
  #sessbar.on{display:flex;align-items:center;gap:10px}
  body.hasbar{padding-bottom:132px}
  .kgin{width:100%;text-align:center;font-size:17px;font-weight:800;padding:11px 4px;height:auto}
  .cthumb{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:8px;display:block;background:var(--card2)}
  nav button{font-size:9.5px}
  .cbub{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.65;word-break:break-word}
  .cbub.user{align-self:flex-end;background:var(--accent);color:#16181c;font-weight:600;border-bottom-right-radius:4px}
  .cbub.assistant{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--chip);color:var(--sub);font-weight:700}
  .pill.hot{background:rgba(229,72,77,.14);color:var(--warn)}
  .pill.ok{background:rgba(198,242,78,.16);color:var(--accentD)}
  .del{color:var(--sub);font-size:11px;opacity:.6;background:none;border:none;cursor:pointer;padding:4px 6px}
  .del:active{opacity:1;color:var(--warn)}
  .gallery{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;cursor:pointer}
  .banner{background:var(--card2);border:1px solid var(--line);color:var(--sub);font-size:12px;
    padding:10px 12px;border-radius:10px;margin-bottom:10px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;
    align-items:center;justify-content:center;padding:16px}
  .overlay.on{display:flex}
  .overlay img{max-width:100%;max-height:80vh;border-radius:10px}
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none}
  .sheet.on{display:block}
  .close{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer}
  .kpi{display:flex;gap:8px}.kpi>div{flex:1;text-align:center;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:10px 4px}
  .kpi b{font-size:20px;display:block;font-weight:800}.kpi span{font-size:11px;color:var(--sub)}
  svg{display:block;width:100%;height:auto}
  .hint{font-size:12px;color:var(--sub);margin-top:4px}
  .stp{display:flex;align-items:center;gap:5px}
  .stp button{min-width:42px;height:44px;padding:0 4px;border:1px solid var(--line);background:var(--card2);border-radius:9px;
    font-size:16px;color:var(--accentD);cursor:pointer;flex:0 0 auto;font-weight:800}
  .stp input{text-align:center}
  .timerBig{font-size:48px;font-weight:800;text-align:center;margin:12px 0;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .timerBig.work{color:var(--accentD)} .timerBig.rest{color:var(--accent2)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
  .calh{text-align:center;font-size:11px;color:var(--sub);padding:2px}
  .calc{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--card2);border-radius:9px;
    font-size:14px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:600}
  .calc.has{border-color:var(--accentD);color:var(--accentD);font-weight:800}
  .calc.tod{background:rgba(198,242,78,.14)}
  .calc .dot{position:absolute;bottom:5px;left:calc(50% - 5px);width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .calc .dot2{position:absolute;bottom:5px;left:calc(50% + 1px);width:6px;height:6px;border-radius:50%;background:var(--accent2)}
  .minibtn{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:9px 13px;font-size:14px;cursor:pointer;color:var(--ink);font-weight:600}
  .settbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
  .settbl td{padding:5px 3px}
  .settbl tr.hd td{color:var(--sub);font-size:12px}
  .miniset{display:flex;align-items:center;gap:4px}
  .miniset button{width:32px;height:42px;border:1px solid var(--line);background:var(--card2);border-radius:8px;color:var(--accentD);font-weight:800;font-size:18px;cursor:pointer;flex:0 0 auto}
  .miniset input{width:54px;text-align:center;padding:9px 2px;font-size:16px;font-weight:700}
  .ck{width:46px;height:42px;border:1px solid var(--line);background:var(--card2);border-radius:9px;color:var(--sub);cursor:pointer;font-weight:800;font-size:16px;flex:0 0 auto}
  .ck.on{background:var(--accent);color:#16181c;border-color:var(--accentD)}
  /* --- セット行（重量±5/±1・回数±1） --- */
  .setwrap{margin-top:8px}
  .setrow{border-top:1px solid var(--line);padding:9px 0}
  .setrow:first-child{border-top:none}
  .setrow.done{background:rgba(198,242,78,.10);border-radius:9px;padding-left:5px;padding-right:5px}
  .setln{display:flex;align-items:center;gap:5px}
  .setno{width:22px;flex:0 0 auto;font-weight:800;color:var(--sub);font-size:13px;text-align:center}
  .stepb{flex:0 0 auto;min-width:31px;height:42px;padding:0 2px;border:1px solid var(--line);background:var(--card2);
    border-radius:8px;color:var(--accentD);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .stepb:active{background:var(--accent);color:#16181c}
  .numin{flex:1 1 auto;min-width:0;width:auto;text-align:center;font-size:17px;font-weight:800;padding:10px 2px}
  .unit{flex:0 0 auto;font-size:12px;color:var(--sub);font-weight:700;width:17px}
  /* --- 解剖ページ（雑誌風レイアウト） --- */
  .anatbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .anathero{padding:22px 2px 16px;border-bottom:3px solid var(--ink);margin-bottom:14px}
  .anatkicker{display:inline-block;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;
    letter-spacing:.14em;padding:4px 10px;border-radius:3px}
  .anattitle{font-size:29px;line-height:1.12;font-weight:800;margin:10px 0 4px;letter-spacing:-.01em}
  .anaten{font-size:11.5px;font-weight:800;letter-spacing:.22em;color:var(--sub)}
  .swatch{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid;vertical-align:-1px;margin-right:3px}
  .mcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accentD);
    border-radius:10px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .mhead{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
  .mno{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .mno.sub{background:var(--accent2)}
  .mspec{display:flex;gap:8px;border-top:1px dotted var(--line);padding:6px 0;font-size:12.5px;line-height:1.65}
  .mspec>span{flex:0 0 58px;color:var(--sub);font-weight:800;font-size:11px;padding-top:2px;letter-spacing:.03em}
  .mspec>div{flex:1}
  .anatsec{margin:16px 0 0}
  .anatsech{font-size:15px;font-weight:800;border-left:5px solid var(--accentD);padding:1px 0 1px 9px;margin-bottom:9px}
  .anatsech span{display:block;font-size:9.5px;letter-spacing:.2em;color:var(--sub);font-weight:800}
  .cueline{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13.5px;line-height:1.7}
  .cueno{flex:0 0 auto;width:21px;height:21px;border-radius:6px;background:var(--accent);color:#16181c;
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .cueno.warn{background:var(--warn);color:#fff}
  /* --- 長押しドラッグ並べ替え --- */
  .draghead{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .excard.dragging{position:relative;z-index:5;opacity:.95;box-shadow:0 10px 26px rgba(20,30,50,.28);
    border-color:var(--accentD);transition:none}
  .grip{flex:0 0 auto;color:var(--sub);font-size:15px;letter-spacing:-1px;padding:2px 3px 2px 0;line-height:1}
  .dragmode .excard:not(.dragging){transition:transform .12s}
</style>
</head>
<body>
<header>
  <h1>カラダ<span>管理</span></h1>
  <button class="gear" onclick="openSettings()" aria-label="設定"><svg class="gearic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
</header>
<div class="wrap" id="view"></div>

<div id="sessbar"></div>
<nav id="nav"></nav>

<!-- 設定シート -->
<div class="sheet" id="settingsSheet"></div>
<!-- 解剖ページ -->
<div class="sheet" id="anatSheet"></div>
<!-- 画像拡大 -->
<div class="overlay" id="imgOverlay" onclick="this.classList.remove('on')"><img id="imgBig"></div>

<script>
/* ============ データ層 ============ */
const KEY='karada_v1';
const DEFAULT={
  profile:{name:'', goal:'', model:'claude-haiku-4-5-20251001', apiKey:'', modelChat:'claude-sonnet-5', modelData:'claude-haiku-4-5-20251001',
    height:'', age:'', sex:'女', act:1.35, lbm:'', pace:0.15, targets:{}},
  templates:[], workouts:[], runs:[], meals:[],
  supList:[], supLogs:[], measures:[], conditions:[], schedule:[],
  plan:null, soreness:[], sessions:[],
  photoTags:['腹筋セパうっすら','腹筋セパくっきり','くびれ','肩の丸み','下腹の張り','太もも引き締まり','背中のライン'],
  aiChats:[], photoNotes:[], wishlist:[], coachMemo:'', exerciseNotes:{}, aiThreads:{'総合':[]}, dailyNotes:{}, coachLog:[], anatCache:{}, rx:null
};
let D=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(!r)return JSON.parse(JSON.stringify(DEFAULT));
  const d=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),r);
  d.profile=Object.assign(JSON.parse(JSON.stringify(DEFAULT.profile)),r.profile||{});
  if(!Array.isArray(d.aiChats))d.aiChats=[];
  if(!Array.isArray(d.photoNotes))d.photoNotes=[];
  if(!Array.isArray(d.wishlist))d.wishlist=[];
  if(typeof d.coachMemo!=='string')d.coachMemo='';
  if(!d.exerciseNotes||typeof d.exerciseNotes!=='object')d.exerciseNotes={};
  if(!d.aiThreads||typeof d.aiThreads!=='object')d.aiThreads={'総合':Array.isArray(d.aiChats)?d.aiChats:[]};
  if(!Array.isArray(d.aiThreads['総合']))d.aiThreads['総合']=[];
  if(!d.dailyNotes||typeof d.dailyNotes!=='object')d.dailyNotes={};
  if(!Array.isArray(d.coachLog))d.coachLog=[];
  if(!d.anatCache||typeof d.anatCache!=='object')d.anatCache={};
  if(!d.profile.targets||typeof d.profile.targets!=='object')d.profile.targets={};
  if(d.rx&&typeof d.rx!=='object')d.rx=null;
  return d;}catch(e){return JSON.parse(JSON.stringify(DEFAULT));}}
function save(){localStorage.setItem(KEY,JSON.stringify(D));}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=s=>{const d=new Date(s+'T00:00');return (d.getMonth()+1)+'/'+d.getDate();};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mdToHtml(s){let h=esc(s||'');
  h=h.replace(/^\s{0,3}#{1,4}\s*(.+?)\s*$/gm,'<div style="font-weight:800;margin:9px 0 3px">$1</div>');
  h=h.replace(/^\s*(?:[-*]\s+|・\s*)(.+)$/gm,'<div style="padding-left:1.1em;text-indent:-0.8em;margin:2px 0">• $1</div>');
  h=h.replace(/^\s*(\d+)[.)]\s+(.+)$/gm,'<div style="padding-left:1.4em;text-indent:-1.4em;margin:2px 0">$1. $2</div>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/(<\/div>)\n/g,'$1');
  h=h.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  return h;}

/* ============ 画像層 (IndexedDB) ============ */
let _db;
function db(){return new Promise((res,rej)=>{if(_db)return res(_db);
  const r=indexedDB.open('karada_imgs',1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore('imgs',{keyPath:'id'});};
  r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=e=>rej(e);});}
async function imgPut(o){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('imgs','readwrite');t.objectStore('imgs').put(o);t.oncomplete=()=>res();t.onerror=rej;});}
async function imgDel(id){const d=await db();return new Promise((res)=>{const t=d.transaction('imgs','readwrite');t.objectStore('imgs').delete(id);t.oncomplete=()=>res();});}
async function imgAll(){const d=await db();return new Promise((res)=>{const t=d.transaction('imgs','readonly');const rq=t.objectStore('imgs').getAll();rq.onsuccess=()=>res(rq.result||[]);});}
function fileToDataUrl(file,max=1000){return new Promise((res)=>{const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{let{width:w,height:h}=img;if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',.82));};img.src=rd.result;};rd.readAsDataURL(file);});}

/* ============ ルーティング ============ */
const TABS=[['トレ','dumbbell'],['食事','meal'],['からだ','ruler'],['カレンダー','calendar'],['コーチ','coach']];
const ICONS={
  home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10.5V20h11v-9.5"/>',
  dumbbell:'<path d="M4 9v6M7 6.5v11M17 6.5v11M20 9v6M7 12h10"/>',
  meal:'<path d="M6 3v18M4 3v4.5a2 2 0 0 0 4 0V3"/><path d="M16 3v18"/><path d="M16 3c2 0 3 2.2 3 5.5S18 13 16 13"/>',
  ruler:'<rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7.5 8v3M11 8v4.5M14.5 8v3M18 8v4.5"/>',
  calendar:'<rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 9.5h16M9 3v4M15 3v4"/>',
  coach:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>'
};
function navIcon(n){return `<svg class="nic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;}
let tab='トレ', sub={};
function setTab(t){tab=t;render();window.scrollTo(0,0);}
function setSub(k,v){sub[k]=v;render();}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([t,i])=>
    `<button class="${t===tab?'on':''}" onclick="setTab('${t}')"><span class="ic">${navIcon(i)}</span>${t}</button>`).join('');
  const v=document.getElementById('view');
  v.innerHTML=(({'トレ':vTre,'食事':vShoku,'からだ':vKarada,'カレンダー':vCalendar,'コーチ':vCoach}[tab])||vTre)();
  if(tab==='からだ'&&sub.kbody==='写真')loadGallery();
  if(tab==='からだ'&&sub.kbody==='グラフ')drawChart();
  if(tab==='コーチ'&&(sub.coach||'相談')==='相談')setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),40);
  if(tab==='食事')loadCalThumbs(document.getElementById('view'));
  setTimeout(()=>document.querySelectorAll('.exmemo').forEach(autoGrow),20);
  const sb=document.getElementById('sessbar');
  if(sb){const p=D.plan;const active=p&&p.startTs&&!p.endTs;
    if(active){sb.className='on';sb.innerHTML=sessBar();document.body.classList.add('hasbar');}else{sb.className='';sb.innerHTML='';document.body.classList.remove('hasbar');}}
  startSessTick();
}

/* ============ 今日ブロック（カレンダータブの先頭に統合。旧「今日」タブは廃止）============ */
function dailyNoteCard(title){const t=today();
  return `<div class="card">
    <h3 style="margin-top:0">${title||'📝 今日のひとこと・感想'}</h3>
    <textarea id="dailyNote" class="exmemo" oninput="autoGrow(this)" onchange="saveDailyNote()" placeholder="今日の感想・気づき・体調をひとこと（日付ごとに保存）" style="min-height:44px">${esc((D.dailyNotes||{})[t]||'')}</textarea>
  </div>`;}
function todayBlock(){
  const t=today();
  const sc=D.schedule.filter(s=>s.date===t);
  const w=D.workouts.filter(x=>x.date===t).length;
  const m=D.meals.filter(x=>x.date===t);
  const sup=D.supLogs.filter(x=>x.date===t&&x.taken).length;
  const cond=D.conditions.find(x=>x.date===t);
  const greet=(D.profile.name?D.profile.name+' さん、':'')+'今日もおつかれさま';
  return `
  <h2 style="margin-top:14px">${esc(greet)}</h2>
  ${D.profile.goal?`<div class="card"><h3 style="margin-top:0">🎯 目標</h3>${esc(D.profile.goal)}</div>`:''}
  <div class="kpi">
    <div><b>${w}</b><span>トレ</span></div>
    <div><b>${m.length}</b><span>食事記録</span></div>
    <div><b>${sup}</b><span>サプリ✓</span></div>
    <div><b>${cond?(cond.period?'🩸':'—'):'—'}</b><span>周期</span></div>
  </div>
  ${dailyNoteCard()}
  <details class="card"${sc.length?' open':''}>
    <summary style="cursor:pointer;font-weight:700;list-style:none">📅 今日の予定${sc.length?`（${sc.filter(s=>s.done).length}/${sc.length}）`:''}</summary>
    ${sc.length?sc.map(s=>`<div class="item"><label style="display:flex;gap:8px;align-items:center;margin:0">
      <input type="checkbox" ${s.done?'checked':''} onchange="toggleSchedule('${s.id}')">
      <span style="${s.done?'text-decoration:line-through;color:var(--sub)':''}">
      <span class="pill ${s.type==='運動'?'':'ok'}">${s.type}</span> ${esc(s.title)} ${s.time?`<span class="muted">${esc(s.time)}</span>`:''}</span>
      </label><button class="del" onclick="delItem('schedule','${s.id}')">削除</button></div>`).join('')
      :'<div class="muted" style="margin-top:6px">まだ予定なし</div>'}
    <div class="flex3" style="margin-top:10px">
      <select id="scType"><option>運動</option><option>食事</option></select>
      <input id="scTitle" placeholder="内容（例：脚トレ）">
      <input id="scTime" placeholder="時間 任意" style="max-width:90px">
    </div>
    <button class="btn sm ghost" style="margin-top:8px;width:100%" onclick="addSchedule()">＋予定を追加</button>
  </details>`;
}
function addSchedule(){const title=document.getElementById('scTitle').value.trim();if(!title)return;
  D.schedule.push({id:uid(),date:today(),type:document.getElementById('scType').value,title,time:document.getElementById('scTime').value.trim(),done:false});save();render();}
function toggleSchedule(id){const s=D.schedule.find(x=>x.id===id);if(s){s.done=!s.done;save();render();}}

function timerBlock(){return `<details style="margin-top:6px"><summary style="cursor:pointer;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font-weight:700;list-style:none">⏱ タイマー（ストップウォッチ・インターバル）</summary>${vTimer()}</details>`;}
function vKin(){
  const t=today();
  ensurePlan();
  window._itemTimes=computeItemTimes();
  const items=D.plan.items;
  const ended=!!D.plan.endTs;
  const totalVol=items.reduce((a,x)=>a+(ended?itemVolDone(x):itemVol(x)),0);
  const pastDates=[...new Set(D.workouts.map(w=>w.date))].sort().reverse();
  const recentEx=[...new Set(D.workouts.slice().reverse().map(w=>w.name))].slice(0,8);
  const running=D.plan.startTs&&!D.plan.endTs;
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <b>全体のボリューム</b><b style="font-size:18px">${totalVol}kg</b></div>
    <div style="margin-top:8px">${sessCtrl()}</div>
    ${running?`<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px">
      <input type="checkbox" ${D.plan.restOn?'checked':''} onchange="toggleRest()"> 休憩タイマー：セット完了で
      <input type="number" style="width:52px;padding:4px" value="${D.plan.restSec||60}" onchange="D.plan.restSec=+this.value||60;save()">秒カウント
      <span class="restDisp" style="margin-left:auto;font-weight:700;color:var(--accent2)"></span></label>`:''}

  </div>
  <div class="card" style="border-color:var(--accentD)">
    <div class="row" style="justify-content:space-between;align-items:center"><b>🐉 AIに筋トレ相談</b>${aiKey()?'':'<span class="muted" style="font-size:11px">要・開眼</span>'}</div>
    <div class="flex2" style="margin-top:8px">
      <button class="btn sm" onclick="askBuildMenu()">今日のメニュー組んで</button>
      <button class="btn sm gray" onclick="askDiagnoseMenu()">今の内容を診断</button>
    </div>
    <div class="muted" style="font-size:11px;margin-top:6px">目標・履歴・筋肉痛・体調を踏まえてコーチ（Sonnet）が回答。もっと細かい相談はコーチタブでどうぞ。</div>
  </div>
  <datalist id="exList">${[...new Set(D.workouts.map(w=>w.name))].map(n=>`<option>${esc(n)}</option>`).join('')}</datalist>
  ${(()=>{
    const hide=ended&&D.plan.hideUndone!==false;
    const shown=items.map((x,i)=>({x,i})).filter(o=>!hide||itemPerformed(o.x));
    const hidden=items.length-shown.length;
    if(!items.length)return '<div class="card"><div class="muted">種目がまだありません。下で追加するか、過去のメニューを読み込んでね。</div></div>';
    return shown.map(o=>exCard(o.x,o.i)).join('')
      +(ended?`<button class="btn gray sm" style="width:100%;margin-bottom:12px" onclick="toggleHideUndone()">${hide?(hidden?`👁 やってない種目を表示（${hidden}件）`:'👁 全種目を表示'):'🙈 やってない種目を隠す'}</button>`:'');
  })()}
  <div class="card">
    <h3 style="margin-top:0">＋ 種目を追加</h3>

    <div class="row" style="margin-top:6px"><span class="muted" style="width:100%">重量なし（メモのみ）で追加：</span>
      <button class="chip" onclick="addPlanNoWeight('ストレッチ')">＋ストレッチ</button>
      <button class="chip" onclick="addPlanNoWeight('ヨガ')">＋ヨガ</button>
      <button class="chip" onclick="addPlanNoWeight('有酸素')">＋有酸素</button></div>
    ${pastDates.length?`<div style="margin-top:10px"><label style="margin:0">📖 過去の日のメニューを読み込む</label>
      <div class="flex2"><select id="planLoad">${pastDates.slice(0,60).map(d=>`<option value="${d}">${fmtD(d)} (${D.workouts.filter(w=>w.date===d).length}種目)</option>`).join('')}</select>
      <button class="btn sm ghost" style="flex:0 0 auto;width:auto" onclick="loadPlanFromSelect()">読み込む</button></div></div>`:''}
    ${D.templates.length?`<div style="margin-top:10px"><label style="margin:0">📋 テンプレから追加（BurnFitメニュー引き継ぎ用）</label>
      ${D.templates.map(tp=>`<div class="item"><div class="row" style="justify-content:space-between"><b>${esc(tp.name)}</b><button class="del" onclick="delItem('templates','${tp.id}')">削除</button></div>
      <div class="row" style="margin-top:4px">${tp.exercises.map(e=>`<button class="chip" onclick="addPlanName('${esc(e).replace(/'/g,'')}')">＋${esc(e)}</button>`).join('')||'<span class="muted">種目なし</span>'}</div></div>`).join('')}</div>`:''}
    <div class="flex2" style="margin-top:8px"><input id="tpName" placeholder="テンプレ名（例：脚の日）"><input id="tpEx" placeholder="種目をカンマ区切り"></div>
    <button class="btn sm gray" style="width:100%;margin-top:6px" onclick="addTemplate()">＋テンプレ作成</button>
  </div>
  <div class="card">
    <h3 style="margin-top:0">📥 BurnFitの記録を貼り付けて取り込み</h3>
    <div class="muted">記録テキストを貼ると、日付・種目・セットを読み取って履歴に追加。#タグ・URLは無視。</div>
    <textarea id="bfText" placeholder="例）2026-07-14 トレーニング記録／ヒップアダクション／1セット: 30kg 19回 …" style="min-height:80px"></textarea>
    <button class="btn ghost" style="margin-top:8px" onclick="importBurnfit()">取り込む</button>
  </div>
  <h3>これまでの記録（日付ごと）</h3>
  ${workoutHistory(t)}`;
}
function exCard(x,i){
  const prev=[...D.workouts].reverse().find(w=>w.name===x.name&&w.date!==today());
  const tm=(window._itemTimes||{})[x.id];
  const dc=x.noWeight?(x.done?1:0):(x.sets||[]).filter(s=>s.done).length;
  const tot=x.noWeight?1:(x.sets||[]).length;
  const allDone=x.noWeight?x.done:(tot>0&&dc===tot);
  const menuOpen=(window._exMenu||{})[x.id];
  const memoV=exNote(x.name)||x.memo||'';
  const nmQ=esc(x.name).replace(/'/g,'');
  const head=`<div class="row draghead" style="justify-content:space-between;align-items:center" ontouchstart="dragStart(event,'${x.id}')" onmousedown="dragStart(event,'${x.id}')" title="長押しでドラッグして並べ替え">
      <b style="flex:1 1 auto;min-width:0"><span class="grip">⠿</span> ${i+1}. ${x.part?esc(x.part)+' | ':''}${esc(x.name)}${allDone?' <span class="pill ok">✓済</span>':''}${tm!=null?` <span class="pill ok">⏱${fmtMin(tm)}</span>`:''}</b>
      <span style="display:flex;gap:2px;flex:0 0 auto"><button class="minibtn" onclick="openAnat('${nmQ}')" title="解剖ページ（効く筋・神経・意識点）">🫀</button><button class="minibtn" onclick="askForm('${nmQ}')" title="AIにフォーム相談">🐉</button><button class="minibtn${menuOpen?' on':''}" onclick="toggleExMenu('${x.id}')" title="編集メニュー">⋯</button><button class="minibtn" onclick="toggleCollapse('${x.id}')" title="${x.collapsed?'開く':'畳む'}" style="font-size:16px">${x.collapsed?'▸':'▾'}</button></span></div>
    ${menuOpen?`<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"><button class="minibtn" onclick="renameItem('${x.id}')">✎ 名前</button><button class="minibtn" onclick="planMove(${i},-1)">↑ 上へ</button><button class="minibtn" onclick="planMove(${i},1)">↓ 下へ</button><button class="minibtn" style="color:var(--warn)" onclick="planRemove('${x.id}')">🗑 削除</button></div>`:''}`;
  if(x.collapsed){
    return `<div class="card excard" data-eid="${x.id}" style="padding:12px 15px">${head}
    <div class="muted" style="margin-top:2px">${x.noWeight?(x.done?'完了':'メモのみ・未完了'):`総ボリューム ${itemVol(x)}kg・${dc}/${tot}ｾｯﾄ完了`}${memoV?' ・ <span style="color:var(--accentD);font-weight:700">📝メモあり（▸で開く）</span>':''}</div></div>`;
  }
  const nwToggle=`<div style="margin-top:6px"><button class="minibtn" style="${x.noWeight?'background:var(--accent);color:#16181c;border-color:var(--accentD)':''}" onclick="toggleNoWeight('${x.id}')">${x.noWeight?'✓ 重量なし（メモのみ）':'重量なしにする（ストレッチ等）'}</button></div>`;
  if(x.noWeight){
    return `<div class="card excard" data-eid="${x.id}">${head}${nwToggle}
    ${prev&&(prev.memo||(prev.sets&&prev.sets[0]&&prev.sets[0].dur))?`<div style="background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px;font-size:12px;color:var(--sub)">前回 ${fmtD(prev.date)}${prev.sets&&prev.sets[0]&&prev.sets[0].dur?'　⏱'+esc(prev.sets[0].dur):''}${prev.memo?'　📝 '+esc(prev.memo):''}</div>`:''}
    <div class="row" style="margin-top:8px;align-items:center"><label style="margin:0">時間（分）</label>
      <input type="number" inputmode="numeric" style="width:100px" placeholder="分" value="${x.dur??''}" onchange="itemDur('${x.id}',this.value)"></div>
    <textarea class="exmemo" placeholder="メモ（内容・感じたこと）" oninput="autoGrow(this)" onchange="itemMemo('${x.id}',this.value)" style="margin-top:8px;min-height:64px">${esc(memoV)}</textarea>
    <button class="btn ${x.done?'':'ghost'}" style="margin-top:8px" onclick="itemDone('${x.id}')">${x.done?'✓ 完了':'完了にする'}</button>
  </div>`;
  }
  return `<div class="card excard" data-eid="${x.id}">${head}${nwToggle}
    ${prev?`<div style="background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px;font-size:12px;color:var(--sub)">前回 ${fmtD(prev.date)}：${prev.sets.map(fmtSet).join(' , ')||'—'}${prev.memo?'<br>📝 '+esc(prev.memo):''}
      <button class="btn sm ghost" style="margin-top:8px;width:100%" onclick="copyPrevTo('${x.id}')">⭱ 前回の記録をコピー</button></div>`:'<div class="muted" style="font-size:12px;margin-top:6px">はじめての種目</div>'}
    <textarea class="exmemo" placeholder="メモ（フォーム・意識・効いた部位／コーチの書き込みもここに・種目ごとに永続保存）" oninput="autoGrow(this)" onchange="itemMemo('${x.id}',this.value)" style="margin-top:8px;min-height:40px">${esc(memoV)}</textarea>
    <div class="muted" style="margin-top:8px">総ボリューム ${itemVol(x)}kg${weightDeltaHtml(x,prev)}</div>
    <div class="setwrap">
      ${(x.sets||[]).map((s,j)=>{const pv=(prev&&prev.sets)?prev.sets[j]:null;const pk=pv&&pv.weight!=null?pv.weight:'kg';const pr=pv&&pv.reps!=null?pv.reps:'回';return `<div class="setrow${s.done?' done':''}">
        <div class="setln">
          <span class="setno">${j+1}</span>
          <button class="stepb" onclick="setStep('${x.id}',${j},'kg',-5)">−5</button>
          <button class="stepb" onclick="setStep('${x.id}',${j},'kg',-1)">−1</button>
          <input class="numin" type="number" inputmode="decimal" value="${s.kg??''}" placeholder="${pk}" onchange="setField('${x.id}',${j},'kg',this.value)">
          <span class="unit">kg</span>
          <button class="stepb" onclick="setStep('${x.id}',${j},'kg',1)">+1</button>
          <button class="stepb" onclick="setStep('${x.id}',${j},'kg',5)">+5</button>
          <button class="ck ${s.done?'on':''}" onclick="setDone('${x.id}',${j})">✓</button>
        </div>
        <div class="setln" style="margin-top:5px;padding-left:27px">
          <button class="stepb" onclick="setStep('${x.id}',${j},'reps',-1)">−1</button>
          <input class="numin" style="max-width:96px" type="number" inputmode="numeric" value="${s.reps??''}" placeholder="${pr}" onchange="setField('${x.id}',${j},'reps',this.value)">
          <span class="unit">回</span>
          <button class="stepb" onclick="setStep('${x.id}',${j},'reps',1)">+1</button>
          <span style="flex:1 1 auto"></span>
          <span class="muted" style="font-size:11px">${(+s.kg>0&&+s.reps>0)?(Math.round(+s.kg*+s.reps))+'kg':''}</span>
        </div>
      </div>`;}).join('')}
    </div>
    <div class="row" style="margin-top:6px"><button class="minibtn" onclick="setDel('${x.id}')">− セット削除</button><button class="minibtn" style="color:var(--accentD)" onclick="setAdd('${x.id}')">＋ セット追加</button></div>
  </div>`;
}
/* ---- プラン（種目カード）データ ---- */
function ensurePlan(){if(!D.plan||D.plan.date!==today())D.plan={date:today(),items:[],startTs:null,endTs:null,restOn:true,restSec:60,paused:false,accum:0,segStart:null};
  if(D.plan.restSec==null)D.plan.restSec=60;if(D.plan.restOn==null)D.plan.restOn=true;
  if(D.plan.paused==null)D.plan.paused=false;if(D.plan.accum==null)D.plan.accum=0;if(D.plan.segStart==null)D.plan.segStart=D.plan.startTs||null;
  if(D.plan.hideUndone==null)D.plan.hideUndone=true;if(D.plan.review==null)D.plan.review='';
  D.plan.items.forEach(it=>{if(!Array.isArray(it.sets))it.sets=[{kg:'',reps:'',done:false}];if(it.memo==null)it.memo='';if(it.part==null)it.part='';if(it.noWeight==null)it.noWeight=false;if(it.collapsed==null)it.collapsed=false;if(it.dur==null)it.dur='';});}
function newItem(n){return {id:uid(),name:n,part:'',memo:'',noWeight:false,dur:'',done:false,doneTs:null,collapsed:false,sets:[{kg:'',reps:'',done:false}]};}
function toggleCollapse(id){const x=planItem(id);if(!x)return;x.collapsed=!x.collapsed;save();render();}
function toggleExMenu(id){window._exMenu=window._exMenu||{};window._exMenu[id]=!window._exMenu[id];render();}
function collapseCompleted(){ensurePlan();let n=0;D.plan.items.forEach(it=>{const done=it.noWeight?it.done:((it.sets||[]).length&&it.sets.every(s=>s.done));if(done&&!it.collapsed){it.collapsed=true;n++;}});save();render();}
function renameItem(id){const x=planItem(id);if(!x)return;const n=prompt('種目名',x.name);if(n&&n.trim()){x.name=n.trim();save();render();}}
function toggleNoWeight(id){const x=planItem(id);if(!x)return;x.noWeight=!x.noWeight;save();render();}
function itemDone(id){const x=planItem(id);if(!x)return;x.done=!x.done;x.doneTs=x.done?Date.now():null;if(x.done){if(!D.plan.startTs)sessStart();x.collapsed=true;}save();render();}
function addPlanNoWeight(n){ensurePlan();const it=newItem(n);it.noWeight=true;D.plan.items.push(it);save();render();}
function itemVol(x){return Math.round((x.sets||[]).reduce((a,s)=>a+((+s.kg||0)*(+s.reps||0)),0));}
function itemVolDone(x){return Math.round((x.sets||[]).filter(s=>s.done).reduce((a,s)=>a+((+s.kg||0)*(+s.reps||0)),0));}
function weightDeltaHtml(x,prev){const c=Math.max(0,...(x.sets||[]).map(s=>+s.kg||0));const p=prev?Math.max(0,...(prev.sets||[]).map(s=>+s.weight||0)):0;
  if(!prev||c<=0)return '';const d=Math.round((c-p)*10)/10;const col=d>0?'#4da3ff':d<0?'#ff6b5a':'var(--sub)';
  return ` ・ <span style="color:${col};font-weight:800">最大${c}kg${d!==0?'（前回比'+(d>0?'+':'')+d+'kg）':'（前回と同じ）'}</span>`;}
function askCooldown(){ensurePlan();const names=(D.plan.items||[]).filter(it=>it.noWeight?it.done:(it.sets||[]).some(s=>s.done)).map(it=>it.name).join('・')||'今日のトレ';
  coachAsk('今日やった種目（'+names+'）に合う、最後のクールダウン/ストレッチを2〜3個提案して。各どの筋を狙うか・目的を解剖学的に簡潔に添えて。');}
function planItem(id){ensurePlan();return D.plan.items.find(x=>x.id===id);}
function addPlan(){const n=(document.getElementById('planEx').value||'').trim();if(!n)return;ensurePlan();D.plan.items.push(newItem(n));save();render();}
function addPlanName(n){ensurePlan();D.plan.items.push(newItem(n));save();render();}
function planMove(i,d){ensurePlan();const a=D.plan.items;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render();}
/* ---- 長押しドラッグで並べ替え ---- */
let _drag=null,_lpT=null,_lpFrom=null;
function _pt(e){return (e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;}
function dragStart(e,id){
  if(e.target&&e.target.closest&&e.target.closest('button'))return;
  if(e.type==='mousedown'&&e.button!==0)return;
  const card=e.currentTarget.closest('.excard');if(!card)return;
  const p=_pt(e);_lpFrom={x:p.clientX,y:p.clientY};
  clearTimeout(_lpT);
  _lpT=setTimeout(function(){
    const cards=[].slice.call(document.querySelectorAll('.excard')).map(function(el){
      const r=el.getBoundingClientRect();return {el:el,id:el.dataset.eid,top:r.top,h:r.height};});
    _drag={id:id,card:card,y0:_lpFrom.y,dy:0,cards:cards};
    card.classList.add('dragging');document.body.classList.add('dragmode');
    try{if(navigator.vibrate)navigator.vibrate(25);}catch(_){}
  },420);
}
function dragMove(e){
  const p=_pt(e);
  if(!_drag){if(_lpFrom&&(Math.abs(p.clientY-_lpFrom.y)>8||Math.abs(p.clientX-_lpFrom.x)>8))clearTimeout(_lpT);return;}
  if(e.cancelable)e.preventDefault();
  _drag.dy=p.clientY-_drag.y0;
  _drag.card.style.transform='translateY('+_drag.dy+'px)';
  const me=_drag.cards.find(function(c){return c.id===_drag.id;});
  const y=me.top+_drag.dy+me.h/2;
  _drag.cards.forEach(function(c){
    if(c.id===_drag.id)return;
    const mid=c.top+c.h/2;
    const shift=(mid>me.top&&mid<y)?-me.h:((mid<me.top&&mid>y)?me.h:0);
    c.el.style.transform=shift?('translateY('+shift+'px)'):'';
  });
}
function dragEnd(){
  clearTimeout(_lpT);_lpFrom=null;
  if(!_drag)return;
  const d=_drag;_drag=null;
  d.card.classList.remove('dragging');document.body.classList.remove('dragmode');
  d.cards.forEach(function(c){c.el.style.transform='';});
  const me=d.cards.find(function(c){return c.id===d.id;});
  const y=me.top+d.dy+me.h/2;
  const others=d.cards.filter(function(c){return c.id!==d.id;});
  const before=others.find(function(c){return y<c.top+c.h/2;});
  ensurePlan();
  const a=D.plan.items;const from=a.findIndex(function(x){return x.id===d.id;});
  if(from<0){render();return;}
  const it=a.splice(from,1)[0];
  let at=before?a.findIndex(function(x){return x.id===before.id;}):-1;
  if(at<0)at=a.length;
  a.splice(at,0,it);save();render();
}

document.addEventListener('touchend',dragEnd);
document.addEventListener('touchcancel',dragEnd);
document.addEventListener('mousemove',dragMove);

function setField(id,j,f,v){const x=planItem(id);if(x&&x.sets[j]){x.sets[j][f]=(v===''?'':(+v));save();render();}}
function setStep(id,j,f,d){const x=planItem(id);if(!x||!x.sets[j])return;const cur=+x.sets[j][f]||0;x.sets[j][f]=Math.max(0,Math.round((cur+d)*10)/10);save();render();}
function setDone(id,j){const x=planItem(id);if(!x||!x.sets[j])return;const s=x.sets[j];s.done=!s.done;s.doneTs=s.done?Date.now():null;

/* ---- トレ実行/時間計測 ---- */
function fmtMin(sec){sec=Math.round(sec||0);if(sec<60)return sec+'秒';const m=Math.floor(sec/60);if(m<60)return m+'分';return Math.floor(m/60)+'時間'+(m%60)+'分';}
function computeItemTimes(){const p=D.plan;const map={};if(!p||!p.startTs)return map;
  const arr=p.items.map(it=>{let ts=null;
    if(it.noWeight){if(it.done&&it.doneTs)ts=it.doneTs;}
    else{const a=(it.sets||[]).filter(s=>s.done&&s.doneTs).map(s=>s.doneTs);if(a.length)ts=Math.max(...a);}
    return ts?{id:it.id,ts}:null;}).filter(Boolean).sort((a,b)=>a.ts-b.ts);
  let prev=p.startTs;arr.forEach(o=>{map[o.id]=Math.max(0,(o.ts-prev)/1000);prev=o.ts;});return map;}
function elapsedSec(){const p=D.plan;if(!p||!p.startTs)return 0;
  const run=!p.endTs&&!p.paused&&p.segStart;return (p.accum||0)+(run?(Date.now()-p.segStart)/1000:0);}
function sessCtrl(){const p=D.plan;

    const pauseBtn=p.paused
      ?`<button class="btn sm" style="width:auto" onclick="sessResume()">▶ 再開</button>`

    <span style="display:flex;gap:8px">${pauseBtn}<button class="btn warn sm" style="width:auto" onclick="sessEnd()">■ 完了</button></span></div>`;}
  return `<div class="row" style="justify-content:space-between;align-items:center">

    <button class="btn gray sm" style="width:auto" onclick="sessReset()">やり直す</button></div>
    ${reviewBlock()}
    ${dailyNoteCard('📝 今日のひとこと・感想（トレの記録に添える）')}

function itemPerformed(it){return it.noWeight?!!it.done:(it.sets||[]).some(s=>s.done);}
function toggleHideUndone(){ensurePlan();D.plan.hideUndone=(D.plan.hideUndone===false);save();render();}
function reviewBlock(){const p=D.plan;
  if(window._reviewBusy)return `<div class="card" style="margin-top:8px;background:var(--card2)"><b>🐉 今日の総評</b><div class="muted" style="margin-top:4px">まとめてるところ…</div></div>`;
  if(p.review)return `<div class="card" style="margin-top:8px;background:var(--card2)">
    <div class="row" style="justify-content:space-between;align-items:center"><b>🐉 今日の総評</b>

function sessSummaryText(){ensurePlan();const p=D.plan;const t=window._itemTimes||computeItemTimes();
  const done=(p.items||[]).filter(itemPerformed);
  const lines=done.map(it=>{
    if(it.noWeight)return `・${it.name}（重量なし${it.dur?'／'+it.dur+'分':''}）${it.memo?' メモ:'+it.memo:''}`;
    const ss=(it.sets||[]).filter(s=>s.done);
    const vol=itemVolDone(it);const mx=Math.max(0,...ss.map(s=>+s.kg||0));
    return `・${it.name}：${ss.length}セット（${ss.map(s=>`${s.kg||'-'}kg×${s.reps||'-'}回`).join(', ')}）最大${mx}kg／ボリューム${vol}kg${t[it.id]?`／所要${fmtMin(t[it.id])}`:''}${it.memo?' メモ:'+it.memo:''}`;});
  const totalVol=done.reduce((a,it)=>a+itemVolDone(it),0);
  const skipped=(p.items||[]).filter(it=>!itemPerformed(it)).map(it=>it.name);
  return `【今日のトレ実績】運動時間 ${fmtMin(p.accum||0)}／総ボリューム ${totalVol}kg\n${lines.join('\n')||'（実施記録なし）'}${skipped.length?'\n（予定したがやらなかった種目：'+skipped.join('・')+'）':''}`;}
async function makeReview(force){ensurePlan();const p=D.plan;
  if(!aiKey())return force?alert('先にコーチを開眼（設定でAPIキー）してね'):null;
  if(!(p.items||[]).some(itemPerformed))return;
  if(p.review&&!force)return;
  window._reviewBusy=true;render();
  const sys=aiSystem()+`\n【今回のタスク】トレ終了直後の総評。3〜5行で簡潔に。①今日の要点（部位バランス・ボリューム・前回比）②よかった点1つ③次回の具体的な一手（種目/重量/回数のどれかを数字で）。前置き・一般論・カロリー論は書かない。NOTE[]やMEMO:は使わない。`;
  try{const ans=await aiCallRetry([{role:'user',content:sessSummaryText()+'\n\n上のトレを総評して。'}],{system:sys,model:aiModelData(),max_tokens:700});
    p.review=(ans||'').replace(/^\s*MEMO[:：].*$/gmi,'').trim();}
  catch(e){p.review='⚠️ 総評を作れませんでした（'+e.message+'）\n（↻ 作り直す でもう一度試せます）';}

function sessStart(){ensurePlan();const n=Date.now();D.plan.startTs=n;D.plan.segStart=n;D.plan.accum=0;D.plan.paused=false;D.plan.endTs=null;save();render();}
function sessPause(){ensurePlan();const p=D.plan;if(p.startTs&&!p.endTs&&!p.paused){p.accum=(p.accum||0)+(Date.now()-p.segStart)/1000;p.paused=true;p.segStart=null;}save();render();}
function sessResume(){ensurePlan();const p=D.plan;if(p.paused){p.paused=false;p.segStart=Date.now();}save();render();}
function sessEnd(){ensurePlan();if(!D.plan.startTs)return;const p=D.plan;
  if(!p.paused&&p.segStart)p.accum=(p.accum||0)+(Date.now()-p.segStart)/1000;
  p.paused=false;p.segStart=null;D.plan.endTs=Date.now();
  const t=computeItemTimes();
  D.plan.items.forEach(it=>{
    if(it.noWeight){if(it.done||it.memo||it.dur)D.workouts.push({id:uid(),date:today(),name:it.name,sets:(it.dur?[{dur:it.dur+'分'}]:[]),memo:it.memo||'',noWeight:true});return;}
    const sets=(it.sets||[]).filter(s=>(s.kg!==''&&s.kg!=null)||(s.reps!==''&&s.reps!=null))
    .map(s=>({weight:(s.kg===''||s.kg==null)?null:+s.kg,reps:(s.reps===''||s.reps==null)?null:+s.reps}));
    if(sets.length)D.workouts.push({id:uid(),date:today(),name:it.name,sets,memo:it.memo||''});});

    items:D.plan.items.filter(it=>it.noWeight?it.done:(it.sets||[]).some(s=>s.done)).map(it=>({name:it.name,sec:Math.round(t[it.id]||0)}))});

  return dates.map(d=>{const ws=byDate[d];const vol=ws.reduce((a,w)=>a+wVol(w),0);

    </div>`;}).join('');}
function parseBurnfit(text){
  const dm=text.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
  const date=dm?`${dm[1]}-${String(dm[2]).padStart(2,'0')}-${String(dm[3]).padStart(2,'0')}`:today();
  const setRe=/^\d+\s*セット\s*[:：]/;
  const items=[]; let cur=null;
  text.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    if(/^#/.test(line)||/^https?:\/\//.test(line)||/トレーニング記録/.test(line))return;
    if(setRe.test(line)){
      if(!cur)return;
      const body=line.replace(setRe,'').trim();
      const kg=body.match(/([\d.]+)\s*kg/), rep=body.match(/([\d.]+)\s*回/), min=body.match(/([\d.]+)\s*分/);
      const s={};
      if(kg)s.weight=+kg[1];
      if(rep)s.reps=+rep[1];
      if(min&&!kg&&!rep)s.dur=min[1]+'分';
      if(Object.keys(s).length)cur.sets.push(s);
    }else{
      cur={id:uid(),date,name:line,sets:[],memo:''}; items.push(cur);
    }
  });
  return {date, items:items.filter(i=>i.sets.length)};
}
function importBurnfit(){
  const t=document.getElementById('bfText').value.trim();
  if(!t){alert('BurnFitの記録テキストを貼ってね');return;}
  const {date,items}=parseBurnfit(t);
  if(!items.length){alert('種目・セットが読み取れませんでした。書式を確認してね');return;}
  const summary=items.map(i=>`・${i.name}（${i.sets.length}セット）`).join('\n');
  if(!confirm(`${date} の記録として次を追加します：\n\n${summary}\n\nよろしい？`))return;
  items.forEach(i=>D.workouts.push(i));
  save();render();
}

let _sw={t:0,run:false,iv:null};
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function swTick(){_sw.t++;const d=document.getElementById('swDisp');if(d)d.textContent=fmtT(_sw.t);}
function swToggle(){const b=document.getElementById('swBtn');
  if(_sw.run){clearInterval(_sw.iv);_sw.run=false;b.textContent='再開';}
  else{_sw.iv=setInterval(swTick,1000);_sw.run=true;b.textContent='一時停止';}}
function swReset(){clearInterval(_sw.iv);_sw={t:0,run:false,iv:null};const d=document.getElementById('swDisp');if(d)d.textContent='00:00';const b=document.getElementById('swBtn');if(b)b.textContent='スタート';}

function beep(f){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=f||880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.25,c.currentTime);o.start();o.stop(c.currentTime+0.18);}catch(e){}if(navigator.vibrate)navigator.vibrate(160);}
function ivRender(){const d=document.getElementById('ivDisp'),p=document.getElementById('ivPhase');
  if(d){d.textContent=_iv.left;d.className='timerBig '+_iv.phase;}
  if(p)p.textContent=(_iv.phase==='work'?'運動':'休憩')+`  ${_iv.round+1}/${_iv.rounds}`;}
function ivStep(){_iv.left--;
  if(_iv.left<=0){
    if(_iv.phase==='work'){_iv.round++;if(_iv.round>=_iv.rounds){ivDone();return;}_iv.phase='rest';_iv.left=_iv.rest;beep(440);}
    else{_iv.phase='work';_iv.left=_iv.work;beep(880);}
  }
  ivRender();}
function ivToggle(){const b=document.getElementById('ivBtn');
  if(_iv.run){clearInterval(_iv.timer);_iv.run=false;b.textContent='再開';return;}
  if(_iv.phase===''){_iv.work=+document.getElementById('ivWork').value||40;_iv.rest=+document.getElementById('ivRest').value||20;_iv.rounds=+document.getElementById('ivRounds').value||8;_iv.round=0;_iv.phase='work';_iv.left=_iv.work;beep(880);}
  _iv.timer=setInterval(ivStep,1000);_iv.run=true;b.textContent='一時停止';ivRender();}

/* 採寸の推移に、その週の平均摂取カロリーを重ねる＝「このカロリーで実際どう動いたか」を自分のデータで見る */
function weekAvgKcal(dateStr,days){days=days||7;const end=new Date(dateStr+'T00:00');let s=0,n=0;
  for(let i=0;i<days;i++){const d=new Date(end);d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);
    if(D.meals.some(m=>m.date===ds)){s+=dayIntake(ds).k;n++;}}
  return n?Math.round(s/n):null;}
function drawChart(){const box=document.getElementById('chartBox');if(!box)return;
  const k=document.getElementById('chartPick').value;
  const fld=MFIELDS.find(f=>f[0]===k)||[k,k,''];
  const pts=D.measures.filter(m=>m[k]!=null).map(m=>({x:m.date,y:m[k]}));
  if(pts.length<2){box.innerHTML='<div class="muted">データが2件以上たまるとグラフが出ます</div>';return;}
  const ov=!!window._chartOv;
  const W=460,H=190,pad=34;const ys=pts.map(p=>p.y);const mn=Math.min(...ys),mx=Math.max(...ys);const rng=(mx-mn)||1;
  const X=i=>pad+i*(W-2*pad)/(pts.length-1);const Y=v=>H-pad-((v-mn)/rng)*(H-2*pad);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.4" fill="#2f9e83"/>`).join('');
  const labs=pts.map((p,i)=>(i%Math.ceil(pts.length/5)===0||i===pts.length-1)?`<text x="${X(i)}" y="${H-8}" font-size="10" fill="var(--sub)" text-anchor="middle">${fmtD(p.x)}</text>`:'').join('');
  let ovSvg='',ovLeg='',ovNote='';
  if(ov){
    const ks=pts.map(p=>weekAvgKcal(p.x));
    const val=ks.filter(v=>v!=null);
    if(val.length>=2){
      const kmn=Math.min(...val),kmx=Math.max(...val),krng=(kmx-kmn)||1;
      const KY=v=>H-pad-((v-kmn)/krng)*(H-2*pad);
      let d='',prev=false;
      ks.forEach((v,i)=>{if(v==null){prev=false;return;}d+=`${prev?'L':'M'}${X(i).toFixed(1)},${KY(v).toFixed(1)} `;prev=true;});
      ovSvg=`<path d="${d.trim()}" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="5 4"/>`
        +ks.map((v,i)=>v==null?'':`<circle cx="${X(i).toFixed(1)}" cy="${KY(v).toFixed(1)}" r="2.6" fill="var(--accent2)"/>`).join('')
        +`<text x="${W-4}" y="14" font-size="10" fill="var(--accent2)" text-anchor="end">${kmx}kcal</text>
          <text x="${W-4}" y="${H-pad}" font-size="10" fill="var(--accent2)" text-anchor="end">${kmn}kcal</text>`;
      ovLeg=`　<span style="color:var(--accent2)">┅</span> 摂取kcal（直前7日の平均）`;
    }else ovNote='<div class="muted" style="font-size:11px;margin-top:4px">※ 食事の記録がまだ少なくて重ねられません（採寸日の直前7日に食事記録が必要）</div>';
  }
  const first=pts[0],last=pts[pts.length-1];const diff=Math.round((last.y-first.y)*10)/10;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}">
    <text x="4" y="14" font-size="10" fill="#2f9e83">${mx}${fld[2]}</text><text x="4" y="${H-pad}" font-size="10" fill="#2f9e83">${mn}${fld[2]}</text>
    <path d="${line}" fill="none" stroke="#2f9e83" stroke-width="2.4"/>${dots}${ovSvg}${labs}</svg>
    <div class="muted"><span style="color:#2f9e83">━</span> ${fld[1]}${ovLeg}</div>
    <div class="muted" style="margin-top:4px">最新 <b>${last.y}${fld[2]}</b>（${pts.length}件・初回から ${diff>0?'+':''}${diff}${fld[2]}）</div>
    ${ovNote}
    ${ov&&ovSvg?'<div class="muted" style="font-size:11px;margin-top:6px;line-height:1.7">2本の動きを見比べると、「自分の体が実際どのカロリーで動いたか」が分かります。推定式より<b>自分の実測のほうが正確</b>なので、数週間たまったらこっちを基準にしてね。</div>':''}`;
}

function aiKey(){return (D.profile.apiKey||'').trim();}

async function aiCall(messages,opts){opts=opts||{};
  const key=aiKey();if(!key)throw new Error('APIキーが未設定です（設定→AIコーチ）');
  const body={model:opts.model||aiModelChat(),max_tokens:opts.max_tokens||1024,messages};
  if(opts.system)body.system=opts.system;
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),60000);let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body),signal:ctrl.signal});}
  catch(e){clearTimeout(to);throw new Error(e&&e.name==='AbortError'?'タイムアウト（60秒無応答）。通信環境を確認して、もう一度送ってね':'通信エラー: '+((e&&e.message)||e));}
  clearTimeout(to);
  if(!res.ok){let t='';try{t=await res.text();}catch(e){}let msg=String(res.status);
    try{const j=JSON.parse(t);if(j.error&&j.error.message)msg=res.status+' '+j.error.message;}catch(e){if(t)msg=res.status+' '+t.slice(0,200);}
    throw new Error('APIエラー: '+msg);}
  const j=await res.json();
  const blocks=j.content||[];const types=blocks.map(b=>b.type).join(',');
  window._aiMeta={model:body.model,stop:j.stop_reason||'?',types,out:(j.usage&&j.usage.output_tokens)||0,in:(j.usage&&j.usage.input_tokens)||0};
  const txt=blocks.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  if(!txt)throw new Error('応答が空でした（stop_reason='+(j.stop_reason||'?')+' / blocks='+(types||'なし')+'）');
  return txt;}

function aiSystem(focus){const p=D.profile;const focusLine=focus?`【今回の話題】種目「${focus}」に集中したスレッドです。${focus}に関する相談・フォーム・記録を中心に答えて。\n`:'';

${focusLine}【目標(理想の体型)】${p.goal||'（未設定）'}
${D.coachMemo?'【覚えておいてほしいこと（本人が明示）】\n'+D.coachMemo+'\n':''}${coachLogText()}${aiContext()}`;}

/* ============ 栄養・エネルギー収支 ============
   BMR (basal metabolic rate／基礎代謝量)、TDEE (total daily energy expenditure／総消費エネルギー量)、
   PFC (protein/fat/carbohydrate／タンパク質・脂質・炭水化物) を扱う。
   ※すべて推定値。医療的な処方ではない。極端な制限にならないよう下限ガードを入れている。 */
const ACT=[[1.2,'ほぼ座り仕事（運動はトレの分だけ）'],[1.35,'立ち仕事・よく歩く'],[1.5,'動き回る勤務（当直・病棟など）']];
const PACE=[[0,'維持（今の体型をキープ）'],[0.10,'ゆるやか（−10%）'],[0.15,'標準（−15%）'],[0.20,'しっかり（−20%）']];
function pfv(k,d){const v=(D.profile||{})[k];return (v===''||v==null||isNaN(+v))?d:+v;}
function curWeight(){const m=[...(D.measures||[])].reverse().find(x=>x.weight!=null&&x.weight!=='');return m?+m.weight:null;}
function bmr(){const p=D.profile||{};const lbm=pfv('lbm',0);
  if(lbm>0)return Math.round(370+21.6*lbm);                       /* Katch-McArdle（除脂肪体重ベース＝InBodyがある時） */
  const w=curWeight(),h=pfv('height',0),a=pfv('age',0);
  if(!w||!h||!a)return null;
  return Math.round(10*w+6.25*h-5*a+(p.sex==='男'?5:-161));}      /* Mifflin-St Jeor */
function bmrKind(){return pfv('lbm',0)>0?'Katch-McArdle（除脂肪体重から）':'Mifflin-St Jeor（身長・年齢・体重から）';}
function exKcal(date){const w=curWeight()||55;let k=0;
  (D.sessions||[]).filter(s=>s.date===date).forEach(s=>{k+=5.0*w*((s.totalSec||0)/3600);});  /* 筋トレ ≒5.0 METs */
  (D.runs||[]).filter(r=>r.date===date).forEach(r=>{k+=1.036*w*(+r.km||0);});                /* ラン ≒1kcal/kg/km */
  return Math.round(k);}
function tdee(date){const b=bmr();if(!b)return null;return Math.round(b*pfv('act',1.35))+exKcal(date||today());}
function targetKcal(date){const t=tdee(date);const b=bmr();if(!t||!b)return null;
  let k=Math.round(t*(1-pfv('pace',0.15)));
  const floor=Math.max(b,(D.profile.sex==='男')?1500:1200);   /* 健康ガード：基礎代謝量を下回らない・極端な低カロリーにしない */
  return Math.max(k,floor);}

  const w=curWeight()||0,lbm=pfv('lbm',0);
  let p=Math.round(lbm>0?lbm*2.4:(w?w*2.0:k*0.3/4));
  let f=Math.max(Math.round(k*0.25/9),w?Math.round(w*0.8):0);
  if(p*4+f*9>k*0.85){p=Math.round(k*0.3/4);f=Math.round(k*0.25/9);}  /* 炭水化物が潰れないよう調整 */
  return {k:k,p:p,f:f,c:Math.max(0,Math.round((k-p*4-f*9)/4))};}

function anatBaseG(dx){return `<g transform="translate(${dx},0)" fill="var(--card2)" stroke="var(--line)" stroke-width="1.2">${ANAT_BASE.join('')}</g>`;}
function anatSvg(prim,sec){
  const num={};prim.forEach((k,i)=>num[k]=i+1);sec.forEach((k,i)=>{if(!num[k])num[k]=prim.length+i+1;});
  let faint='',hot='',marks='';
  Object.keys(MUS).forEach(k=>{const m=MUS[k];const paths=(m.d||[]).map(dd=>`<path d="${dd}"/>`).join('');
    if(prim.indexOf(k)>=0)hot+=`<g fill="var(--accent)" stroke="var(--accentD)" stroke-width="1.2">${paths}</g>`;
    else if(sec.indexOf(k)>=0)hot+=`<g fill="#ffd39a" stroke="var(--accent2)" stroke-width="1">${paths}</g>`;
    else faint+=paths;});
  const placed=[];
  prim.concat(sec).forEach(k=>{const m=MUS[k];if(!m||!m.mk)return;
    let x=m.mk[0],y=m.mk[1],guard=0;
    // 番号バッジ同士が重ならないよう、ぶつかったら少しずつ下へ逃がす
    while(placed.some(p=>Math.abs(p.x-x)<23&&Math.abs(p.y-y)<23)&&guard++<12)y+=23;
    placed.push({x,y});
    marks+=`<g><circle cx="${x}" cy="${y}" r="10" fill="var(--ink)" stroke="#fff" stroke-width="1.8"/>
      <text x="${x}" y="${y+4.1}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="-apple-system,Helvetica,sans-serif">${num[k]}</text></g>`;});
  return `<svg viewBox="0 0 420 392" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
    ${anatBaseG(0)}${anatBaseG(210)}
    <g fill="#dde4ec" stroke="#c9d3dd" stroke-width=".8">${faint}</g>
    ${hot}${marks}
    <text x="100" y="388" text-anchor="middle" font-size="13" font-weight="800" fill="var(--sub)" font-family="-apple-system,sans-serif">ANTERIOR ・ 前面</text>
    <text x="310" y="388" text-anchor="middle" font-size="13" font-weight="800" fill="var(--sub)" font-family="-apple-system,sans-serif">POSTERIOR ・ 背面</text>
  </svg>`;}

function anatNorm(s){return String(s||'').replace(/[\s　・（）()【】\[\]/／]/g,'').toLowerCase();}
function findEx(name){
  const n=anatNorm(name);if(!n)return null;
  const keys=Object.keys(EX);
  for(const k of keys)if(anatNorm(k)===n)return {key:k,data:EX[k]};
  for(const a of Object.keys(EX_ALIAS))if(anatNorm(a)===n)return {key:EX_ALIAS[a],data:EX[EX_ALIAS[a]]};
  for(const k of keys)if(n.indexOf(anatNorm(k))>=0||anatNorm(k).indexOf(n)>=0)return {key:k,data:EX[k]};
  for(const a of Object.keys(EX_ALIAS))if(n.indexOf(anatNorm(a))>=0)return {key:EX_ALIAS[a],data:EX[EX_ALIAS[a]]};
  return null;}
function musSpec(k,no,isP){const m=MUS[k];if(!m)return '';
  return `<div class="mcard">
    <div class="mhead"><span class="mno${isP?'':' sub'}">${no}</span>
      <span><b style="font-size:15px">${m.jp}</b> <span class="muted" style="font-size:11px;letter-spacing:.04em">${m.en}</span>
      <div class="muted" style="font-size:11px">${isP?'主働筋 PRIME MOVER':'協働筋 SYNERGIST'}</div></span></div>
    <div class="mspec"><span>起始</span><div>${m.o}</div></div>
    <div class="mspec"><span>停止</span><div>${m.i}</div></div>
    <div class="mspec"><span>作用</span><div>${m.a}</div></div>
    <div class="mspec"><span>支配神経</span><div><b>${m.n}</b></div></div>
  </div>`;}
function openAnat(name){
  window._anatName=name;
  const s=document.getElementById('anatSheet');s.classList.add('on');s.innerHTML=anatView(name);
  window.scrollTo(0,0);s.scrollTop=0;}
function closeAnat(){const s=document.getElementById('anatSheet');s.classList.remove('on');s.innerHTML='';}
function anatView(name){
  const hit=findEx(name);
  const cached=(D.anatCache||{})[name];
  const nmQ=esc(name).replace(/'/g,'');
  const head=`<div class="anatbar"><b style="font-size:15px">🫀 解剖ページ</b><button class="close" onclick="closeAnat()">✕</button></div>`;
  if(!hit&&!cached){
    return head+`<div class="wrap" style="padding-bottom:40px">
      <div class="card" style="margin-top:14px"><h3 style="margin-top:0">「${esc(name)}」はまだ収録されていません</h3>
      <div class="muted">内蔵の解剖データにこの種目名がありません。AIコーチに作らせて、この端末に保存できます（次回から即表示）。</div>
      <button class="btn" style="margin-top:10px" onclick="genAnat('${nmQ}')">🐉 AIに解剖ページを作らせる</button>
      <div class="muted" style="font-size:11px;margin-top:8px">※ 図はアプリ内蔵のオリジナルSVG。起始・停止・支配神経などの事実は言語モデルの記述を正として表示します（生成画像は使いません）。</div></div></div>`;}
  const d=hit?hit.data:null;
  const prim=(cached&&cached.p)||(d?d.p:[]);
  const sec=(cached&&cached.s)||(d?d.s:[]);
  const en=(d&&d.en)||(cached&&cached.en)||'ANATOMY';
  const cat=(d&&d.cat)||(cached&&cached.cat)||'';
  const num={};prim.forEach((k,i)=>num[k]=i+1);sec.forEach((k,i)=>{if(!num[k])num[k]=prim.length+i+1;});
  return head+`<div class="wrap" style="padding-bottom:56px">
    <div class="anathero">
      <div class="anatkicker">${esc(cat||'ANATOMY')}</div>
      <h1 class="anattitle">${esc(hit?hit.key:name)}</h1>
      <div class="anaten">${esc(en)}</div>
    </div>
    <div class="card" style="padding:10px 8px 4px">
      ${anatSvg(prim,sec)}
      <div class="row" style="gap:12px;justify-content:center;padding:2px 0 8px;font-size:11px">
        <span><span class="swatch" style="background:var(--accent);border-color:var(--accentD)"></span>主働筋</span>
        <span><span class="swatch" style="background:#ffd39a;border-color:var(--accent2)"></span>協働筋</span>
        <span><span class="swatch" style="background:#dde4ec;border-color:#c9d3dd"></span>その他</span>
      </div>
    </div>
    ${prim.map(k=>musSpec(k,num[k],true)).join('')}
    ${sec.map(k=>musSpec(k,num[k],false)).join('')}
    ${d?`<div class="anatsec"><div class="anatsech">意識するポイント<span>CUES</span></div>
      ${d.cue.map((c,i)=>`<div class="cueline"><span class="cueno">${i+1}</span><span>${esc(c)}</span></div>`).join('')}</div>`:''}
    ${d&&d.ng&&d.ng.length?`<div class="anatsec"><div class="anatsech" style="border-color:var(--warn)">よくある代償動作<span>WATCH OUT</span></div>
      ${d.ng.map(c=>`<div class="cueline"><span class="cueno warn">!</span><span>${esc(c)}</span></div>`).join('')}</div>`:''}
    ${cached&&cached.text?`<div class="anatsec"><div class="anatsech">AIコーチの解説<span>AI NOTE</span></div>
      <div style="font-size:13px;line-height:1.75">${mdToHtml(cached.text)}</div>
      <button class="minibtn" style="margin-top:8px" onclick="genAnat('${nmQ}',1)">↻ 作り直す</button></div>`:''}
    ${exNote(hit?hit.key:name)?`<div class="anatsec"><div class="anatsech">あなたのメモ<span>MY NOTE</span></div>
      <div style="font-size:13px;line-height:1.75">${mdToHtml(exNote(hit?hit.key:name))}</div></div>`:''}
    <button class="btn" style="margin-top:14px" onclick="closeAnat();askForm('${nmQ}')">🐉 この種目をコーチに深掘りする</button>
    <div class="muted" style="font-size:11px;margin-top:10px;line-height:1.7">図はこのアプリのために描き起こしたオリジナルの模式図です（形状は簡略化）。起始・停止・作用・支配神経は解剖学の標準的記載に基づくテキストが正で、図はイメージ補助として見てください。</div>
  </div>`;}
async function genAnat(name,force){
  if(!aiKey()){alert('先にコーチを開眼（設定でAPIキー）してね');return;}
  D.anatCache=D.anatCache||{};
  if(D.anatCache[name]&&!force)return;
  const s=document.getElementById('anatSheet');
  s.innerHTML=`<div class="anatbar"><b style="font-size:15px">🫀 解剖ページ</b><button class="close" onclick="closeAnat()">✕</button></div>
    <div class="wrap"><div class="card" style="margin-top:14px"><b>🐉 「${esc(name)}」の解剖ページを作成中…</b><div class="muted" style="margin-top:4px">効く筋・起始停止・神経・意識点をまとめています</div></div></div>`;
  const keys=Object.keys(MUS).join(',');
  const sys=`あなたは解剖学に厳密なスポーツ医学コーチ。整形外科志望の医療従事者向けに回答する。
出力は必ず次の形式で、1行目と2行目は指定どおりに：
MUSCLES: <主働筋のキーをカンマ区切り（1〜2個）>
SUB: <協働筋のキーをカンマ区切り（0〜4個）>
（使えるキーはこの中だけ: ${keys}）
3行目以降は本文（マークダウン、見出し「## 効く筋」「## 意識するポイント」「## よくある代償動作」）。
本文には各筋の起始・停止・作用・支配神経（脊髄髄節つき）を正確に書く。推測が混じる場合はその旨を明記。カロリー収支や部分痩せ等の一般論は書かない。簡潔に。`;
  try{const ans=await aiCallRetry([{role:'user',content:`種目「${name}」の解剖ページを作って。`}],{system:sys,model:aiModelChat(),max_tokens:1600});
    const valid=Object.keys(MUS);
    const pick=(re)=>{const m=ans.match(re);return m?m[1].split(/[,、\s]+/).map(x=>x.trim()).filter(x=>valid.indexOf(x)>=0):[];};
    const p=pick(/^\s*MUSCLES\s*[:：]\s*(.+)$/mi), sb=pick(/^\s*SUB\s*[:：]\s*(.+)$/mi);
    const text=ans.replace(/^\s*MUSCLES\s*[:：].*$/mi,'').replace(/^\s*SUB\s*[:：].*$/mi,'').trim();
    D.anatCache[name]={p:p.length?p:['rectus'],s:sb,en:'AI GENERATED',cat:'AI作成ページ',text:text};
    save();s.innerHTML=anatView(name);s.scrollTop=0;}
  catch(e){s.innerHTML=`<div class="anatbar"><b style="font-size:15px">🫀 解剖ページ</b><button class="close" onclick="closeAnat()">✕</button></div>
    <div class="wrap"><div class="card" style="margin-top:14px">⚠️ 作成に失敗しました<div class="muted" style="margin-top:4px">${esc(e.message)}</div>
    <button class="btn" style="margin-top:10px" onclick="genAnat('${esc(name).replace(/'/g,'')}',1)">もう一度</button></div></div>`;}}

/* ============ 数字入力：タップで全選択（デリート地獄の解消）============ */
document.addEventListener('focusin',function(e){
  const el=e.target;if(!el||el.tagName!=='INPUT')return;
  const t=(el.getAttribute('type')||'').toLowerCase();
  const im=(el.getAttribute('inputmode')||'').toLowerCase();
  if(t!=='number'&&im!=='decimal'&&im!=='numeric')return;
  setTimeout(function(){try{el.select();}catch(_){}},0);
});
