function tlNut(){
  if(!nutReady())return `<div class="muted">⚙設定 →「体・エネルギー設定」を入れると計算されます</div>
    <button class="btn sm gray" style="width:100%;margin-top:8px" onclick="event.stopPropagation();openSettings()">設定をひらく</button>`;
  const t=today(),inn=dayIntake(t),g=targetPFC(t);
  if(!g)return `<div class="muted">目標を計算できません</div>`;
  const left=Math.round(g.k-inn.k), pLeft=Math.max(0,Math.round(g.p-inn.p));
  const h=new Date().getHours();
  /* 夜はタンパク質を主役に。ただしカロリーの残りも併記（Mの希望） */
  if(h>=18)return `<div class="muted" style="font-size:11px">タンパク質</div>
    <div class="big" style="color:${inn.p>=g.p?'var(--accentD)':'var(--accent2)'}">${Math.round(inn.p)}<span style="font-size:13px">/${g.p}g</span></div>
    <div class="muted" style="font-size:11px;margin-top:2px">${inn.p>=g.p?'達成！':'あと'+pLeft+'g'}
      ・カロリーは${left>=0?'あと'+left:'+'+(-left)}kcal${inn.est?`<br>うち${inn.p-inn.pM}gは推定`:''}</div>`;
  return `<div class="muted" style="font-size:11px">カロリー</div>
    <div class="big">${Math.round(inn.k)}<span style="font-size:13px">/${g.k}</span></div>
    <div class="muted" style="font-size:11.5px;margin-top:1px;color:${left<0?'var(--accent2)':'var(--sub)'}">
      ${left>=0?'あと '+left+'kcal':'+'+(-left)+'kcal オーバー'}　P あと${pLeft}g</div>
    <div style="height:7px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:7px">
      <div style="height:100%;width:${Math.min(100,Math.round(inn.k/Math.max(1,g.k)*100))}%;border-radius:4px;
        background:${inn.k>g.k*1.05?'var(--warn)':'var(--accentD)'}"></div></div>`;
}

function tlRx(){

  if(a.tooEarly)return `<div class="muted">処方から${a.days}日。あと${3-a.days}日で出ます</div>`;
  const worst=Math.min(a.logRate,a.kRate,a.pRate);
  const col=worst>=70?'var(--accentD)':worst>=40?'var(--accent2)':'var(--warn)';
  return `<div class="big" style="color:${col}">${worst}<span style="font-size:14px">%</span></div>
    <div class="muted" style="font-size:11.5px">記録${a.logRate}% / kcal${a.kRate}% / P${a.pRate}%</div>`;

function tlFreq(){

/* ---------- タイムライン ---------- */
function v7Events(days){
  const ev=[];
  const lim=new Date();lim.setDate(lim.getDate()-days);
  const limS=lim.toISOString().slice(0,10);
  /* seq＝配列内の位置。時刻が無い記録は「あとから記録したもの＝新しい」として扱う */
  const push=(date,ts,icon,html,kind,cls,seq,extra)=>{
    if(!date||date<limS)return;
    ev.push({date:date,ts:ts||0,icon:icon,html:html,kind:kind,cls:cls||'',
      seq:seq||0,hour:evHour(kind,extra)});
  };
  const fix=(kind,id)=>`<span class="editmark" onclick="event.stopPropagation();openEdit('${kind}','${id}')">✏️ 直す</span>`;
  const wrap=(kind,id,inner)=>`<div onclick="openEdit('${kind}','${id}')" style="cursor:pointer">${fix(kind,id)}${inner}</div>`;

  (D.workouts||[]).forEach((w,i)=>push(w.date,0,'🏋️',
    wrap('workout',w.id,`<b>${esc(w.name)}</b>${setChips(w.sets)}${
      w.memo?`<div class="muted" style="margin-top:4px">${esc(w.memo)}</div>`:''}`),'workout','',i));

  (D.runs||[]).forEach((r,i)=>push(r.date,0,'🏃',
    wrap('run',r.id,`<b>ラン ${esc(String(r.km||'-'))}km</b> <span class="muted">${esc(String(r.min||''))}${r.min?'分':''}</span>${
      r.memo?`<div class="muted">${esc(r.memo)}</div>`:''}`),'run','',i));

  (D.sessions||[]).forEach((s,i)=>push(s.date,s.endTs||0,'⏱',
    wrap('sess',s.id,`<b>トレ終了</b> <span class="muted">${fmtMin(s.totalSec)}・${(s.items||[]).length}種目</span>`),'workout','',i));

  (D.meals||[]).forEach((m,i)=>push(m.date,m.ts||0,'🍽',
    wrap('meal',m.id,
     `<b>${esc(mealTime(m)||'食事')}</b> <span class="pill ${m.level==='食べ過ぎ'||m.level==='チートデイ'?'hot':''}">${esc(m.level||'')}</span>${
      mealHasNut(m)?` <span class="muted">${Math.round(+m.kcal)}kcal / P${Math.round(+m.p||0)}g</span>`
                   :` <span class="muted">約${mealKcal(m)}kcal（推定）</span>`}${
      (m.memo||'').trim()
        ?`<div style="margin-top:3px">${esc(m.memo)}</div>`
        :(aiFoodGuess(m)
          ?`<div style="margin-top:3px">${esc(aiFoodGuess(m))}<span class="muted" style="font-size:11px"> ← AIの読み取り</span></div>`
          :'<div class="muted" style="margin-top:3px">（内容なし）</div>')}
      ${m.photoId?`<img class="cthumb" data-pid="${m.photoId}" alt="食事写真" style="max-height:150px;margin-top:7px">`:''}`),
    'meal','',i,m.type));

  (D.measures||[]).forEach((x,i)=>{
    const t=MFIELDS.filter(f=>x[f[0]]!=null&&x[f[0]]!=='').map(f=>`${f[1]} ${x[f[0]]}${f[2]}`).join('　');
    push(x.date,0,'📏',wrap('measure',x.id,`<b>採寸</b> ${esc(t)||''}${
      x.memo?`<div class="muted">${esc(x.memo)}</div>`:''}`),'measure','',i);});

  (D.conditions||[]).forEach((c,i)=>push(c.date,0,'💗',
    wrap('cond',c.id,`<b>体調</b> ${esc(c.mood||'')} ${c.period?'🩸':''}${
      c.memo?`<div class="muted">${esc(c.memo)}</div>`:''}`),'cond','',i));

  (D.soreness||[]).forEach((s,i)=>push(s.date,0,'🔥',
    wrap('sore',s.id,`<b>筋肉痛</b> ${(s.parts||[]).map(esc).join('・')}${
      s.level?` <span class="pill">${esc(s.level)}</span>`:''}`),'sore','',i));

  Object.keys(D.dailyNotes||{}).forEach(d=>{const t=D.dailyNotes[d];
    if(t&&t.trim())push(d,0,'📝',wrap('note',d,`<b>ひとこと</b><div>${esc(t)}</div>`),'note','',0);});

  /* サプリは日ごとに1行へまとめ、行の中の名前をタップで個別に直す */
  const supByDate={};
  (D.supLogs||[]).forEach((l,i)=>{if(!l.taken)return;
    const s=(D.supList||[]).find(x=>x.id===l.supId);
    (supByDate[l.date]=supByDate[l.date]||[]).push({log:l,name:(s&&s.name)||'サプリ',i:i});});
  Object.keys(supByDate).forEach(d=>{
    const a=supByDate[d];
    push(d,0,'💊',`<b>サプリ</b> ${a.map(x=>
      `<button class="chip" style="margin:2px 4px 2px 0;padding:4px 10px;font-size:12.5px"
        onclick="openEdit('sup','${x.log.id}')">${esc(x.name)} ✏️</button>`).join('')}`,'sup','',
      Math.max.apply(null,a.map(x=>x.i)));});

  if(D.rx&&D.rx.date&&D.rx.text)push(D.rx.date,0,'📋',
    `<b>処方箋</b><div class="muted" style="margin-top:3px">${esc(String(D.rx.text).replace(/\s+/g,' ').slice(0,120))}…</div>
     <button class="btn sm ghost" style="width:100%;margin-top:7px" onclick="openDetail('コーチ','coach','処方箋')">処方箋をひらく</button>`,'coach','',0);

  Object.keys(D.aiThreads||{}).forEach(k=>{(D.aiThreads[k]||[]).forEach((mm,i)=>{
    if(!mm||!mm.ts||!mm.content)return;
    const d=new Date(mm.ts).toISOString().slice(0,10);
    push(d,mm.ts,mm.role==='user'?'<span class="tlme">私</span>':navIcon('coach'),
      `<div onclick="openEdit('coach','${mm.mid||''}')" style="cursor:pointer">
        ${mm.mid?fix('coach',mm.mid):''}
        <div class="t">${mm.role==='user'?'わたし':'コーチ'}${k!=='総合'?'（'+esc(k)+'）':''}
          <span class="muted">${new Date(mm.ts).toTimeString().slice(0,5)}</span></div>
        ${mdToHtml(String(mm.content).slice(0,600))}
        ${(mm.role==='assistant'&&mm.mid&&looksUnformatted(mm.content))
          ? `<button class="btn sm gray" style="width:100%;margin-top:8px"
               onclick="event.stopPropagation();tidyCoach('${mm.mid}')">${
               mm.tidying?'整えています…':'✨ 読みやすく整える'}</button>`:''}</div>`,
      'coach',mm.role==='user'?'me':'',i);});});

  if(D.plan&&D.plan.review)push(D.plan.date||today(),D.plan.endTs||0,navIcon('coach'),
    `<div class="t">コーチ（トレ総評）</div>${mdToHtml(D.plan.review)}`,'coach','',0);

  return ev;
}
function v7Timeline(){
  const ev=v7Events(_tlDays).filter(e=>!_tlFilter||e.kind===_tlFilter
    ||(_tlFilter==='workout'&&e.kind==='run'));
  /* 新しいものが上。日付は降順、同じ日の中も新しい順 */
  ev.sort((a,b)=>a.date===b.date?(evKey(b)-evKey(a)):(a.date<b.date?1:-1));
  const byDate={};ev.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const dates=Object.keys(byDate).sort().reverse();
  const FN={workout:'トレ',meal:'食事',measure:'からだ',cond:'体調',sore:'筋肉痛',sup:'サプリ',coach:'コーチ',note:'メモ',run:'ラン'};
  let h=`<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:2px">
    ${_tlFilter
      ? `<button class="chip on" style="margin:0" onclick="_tlFilter=null;render()">${FN[_tlFilter]||_tlFilter}だけ表示中 ✕</button>`
      : `<span class="muted" style="font-size:11.5px">新しい順・直近${_tlDays}日</span>`}</div>`;
  if(!dates.length)return h+`<div class="card" style="margin-top:12px">
    <b>${_tlFilter?'このことの記録はまだありません':'まだ記録がありません'}</b>
    <div class="muted" style="margin-top:6px;line-height:1.8">
      記録は左下の <span class="k">＋ 記録</span> から。<br>
      下の入力欄に文章を打つとコーチへの相談になります（記録は入りません）。</div>
    <button class="btn" style="margin-top:10px" onclick="openRec()">＋ 記録する</button></div>`;
  dates.forEach(d=>{
    h+=`<div class="tlday" id="tl-${d}"><b>${d===today()?'今日':fmtD(d)}</b><i></i></div>`;
    byDate[d].forEach(e=>{h+=`<div class="tlrow ${e.cls}"><div class="tlic">${e.icon}</div><div class="tlbody">${e.html}</div></div>`;});
  });
  /* 新しい順なので「もっと前」は一番下 */
  h+=`<button class="btn sm gray" style="width:100%;margin-top:14px" onclick="_tlDays+=30;render()">
    ‹ もっと前（あと30日）</button>`;
  return h;
}

}

/* ★ 起動（render の初回呼び出し）は v7edit.js の末尾に移した。

/* =====================================================================
   v7.3
   ① タイムラインを「新しいものが上」に（今日が一番上・夜の記録が昼より上）
   ② よく食べるもの（履歴からタップ1回で記録）

/* ---------- ① 並び順：実質の時刻 ---------- */
/* 記録に時刻が無いものは、種類から「だいたいこの時間」を当てて並べる。
   同じ時刻なら、あとから記録したものを上にする（seq が大きいほど新しい） */
var PSEUDO_HOUR={朝:7,間食:15,昼:12,夜:19};
function evHour(kind,extra){
  if(kind==='meal')return PSEUDO_HOUR[extra]!=null?PSEUDO_HOUR[extra]:13;
  return {sup:8,measure:7,cond:7,sore:9,workout:17,run:18,note:22,coach:20}[kind]||12;
}
function evKey(e){
  /* 同じ日の中での並び。大きいほど新しい */
  return (e.ts?((new Date(e.ts).getHours())+(new Date(e.ts).getMinutes()/60)):e.hour)*1e6+(e.seq||0);
}

/* ---------- ② よく食べるもの ---------- */
function normFood(s){return String(s||'').replace(/\s+/g,'').replace(/[・、,]/g,'・').toLowerCase();}
function favFoods(limit){
  const map={};
  (D.meals||[]).forEach((m,i)=>{
    const t=(m.memo||'').trim();if(!t)return;
    const k=normFood(t);
    if(!map[k])map[k]={label:t,n:0,last:null,lastI:-1};
    map[k].n++;
    if(i>map[k].lastI){map[k].lastI=i;map[k].last=m;map[k].label=t;}
  });
  return Object.keys(map).map(k=>map[k])
    .sort((a,b)=>b.n!==a.n?b.n-a.n:b.lastI-a.lastI)
    .slice(0,limit||20);
}
function mealTypeNow(){return new Date().toTimeString().slice(0,5);}
function openFav(){_sheet='fav';document.getElementById('favSheet').classList.add('on');renderFav();}
function renderFav(){
  const list=favFoods(20);
  const tp=mealTypeNow();
  document.getElementById('favSheet').innerHTML=
   `<div class="sheetbar"><b>⭐️ よく食べるもの</b><button class="close" onclick="closeV7Sheet('favSheet')">✕</button></div>

      ${list.length?`<div class="muted" style="margin-bottom:10px">タップすると<b>いまの時刻（${tp}）</b>で記録します（あとから直せます）。
        栄養の数値は前回のものを引き継ぎます。</div>`
        :`<div class="card"><b>まだありません</b><div class="muted" style="margin-top:6px;line-height:1.8">
          食事を「食べたもの」つきで記録すると、同じものがここに並んでタップ1回で記録できるようになります。</div></div>`}
      ${list.map((f,i)=>{
        const m=f.last||{};const has=mealHasNut(m);
        return `<div class="card" style="padding:12px 14px">
          <div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1 1 auto;min-width:0">
              <b>${esc(f.label)}</b>
              <div class="muted" style="font-size:12px;margin-top:3px">
                ${f.n}回記録${has?`・${Math.round(+m.kcal)}kcal / P${Math.round(+m.p||0)}g`:'・栄養の数値なし'}</div>
            </div>

          </div></div>`;}).join('')}

function favAdd(i){
  const f=favFoods(20)[i];if(!f)return;
  const src=f.last||{};
  const now=Date.now();
  const m={id:uid(),date:today(),ts:now,type:typeFromHour(new Date(now).getHours()),memo:f.label,
    level:src.level||'普通',photoId:''};

var EDIT_TITLE={workout:'🏋️ トレの記録',run:'🏃 ランの記録',measure:'📏 採寸',
  cond:'💗 体調',sore:'🔥 筋肉痛',sup:'💊 サプリ',note:'📝 ひとこと',
  coach:'💬 やりとり',sess:'⏱ トレ終了'};
var EDIT_ARR={workout:'workouts',run:'runs',measure:'measures',cond:'conditions',
  sore:'soreness',sup:'supLogs',sess:'sessions'};

function editFind(kind,id){
  if(kind==='note')return (D.dailyNotes&&D.dailyNotes[id]!=null)?{date:id,text:D.dailyNotes[id]}:null;
  if(kind==='coach'){
    let hit=null;
    Object.keys(D.aiThreads||{}).forEach(k=>{(D.aiThreads[k]||[]).forEach((m,i)=>{
      if(m&&m.mid===id)hit={thread:k,i:i,m:m};});});
    return hit;
  }
  const a=D[EDIT_ARR[kind]]||[];
  return a.find(x=>x&&x.id===id)||null;
}
function openEdit(kind,id){
  if(kind==='meal')return openMeal(id);
  if(!editFind(kind,id))return;
  _sheet='edit';window._editKind=kind;window._editId=id;
  document.getElementById('editSheet').classList.add('on');
  renderEdit();
}
function closeEdit(){
  _sheet=null;window._editKind=null;window._editId=null;
  document.getElementById('editSheet').classList.remove('on');
  render();
}
function editSet(field,v){
  const o=editFind(window._editKind,window._editId);if(!o)return;
  if(window._editKind==='note'){D.dailyNotes[window._editId]=v;save();return;}
  if(window._editKind==='coach'){o.m.content=v;save();return;}
  o[field]=v;save();
}
function editSetNum(field,v){
  const o=editFind(window._editKind,window._editId);if(!o)return;
  o[field]=(v===''||v==null)?'':(+v);save();
}
function editSetRe(field,v){editSet(field,v);renderEdit();}
function editSetDate(v){
  const k=window._editKind;
  if(k==='note'){
    const old=window._editId;if(!v||v===old)return;
    const txt=D.dailyNotes[old];delete D.dailyNotes[old];D.dailyNotes[v]=txt;
    window._editId=v;save();renderEdit();return;
  }
  editSetRe('date',v);
}
function editLabel(){
  const k=window._editKind,id=window._editId,o=editFind(k,id);
  if(!o)return 'この記録';
  if(k==='note')return `${fmtD(o.date)}のひとこと`;
  if(k==='coach')return (o.m.role==='user'?'わたし':'コーチ')+'の発言';
  const d=o.date?fmtD(o.date)+'の':'';
  return d+({workout:o.name||'トレ',run:'ラン',measure:'採寸',cond:'体調',
    sore:'筋肉痛',sup:'サプリ',sess:'トレ終了の記録'}[k]||'記録');
}
function editDelete(){
  const k=window._editKind,id=window._editId;
  if(!confirm(editLabel()+'を消します。戻せません。よろしいですか？'))return;
  if(k==='note'){delete D.dailyNotes[id];}
  else if(k==='coach'){const h=editFind('coach',id);if(h)D.aiThreads[h.thread].splice(h.i,1);}
  else {D[EDIT_ARR[k]]=(D[EDIT_ARR[k]]||[]).filter(x=>x&&x.id!==id);}
  save();closeEdit();
}

function editSetRow(j,field,v){

function editSetStep(j,field,d){
  const w=editFind('workout',window._editId);if(!w||!w.sets||!w.sets[j])return;
  const cur=+w.sets[j][field]||0;
  w.sets[j][field]=Math.max(0,Math.round((cur+d)*10)/10);save();renderEdit();

function editSetAdd(){
  const w=editFind('workout',window._editId);if(!w)return;
  w.sets=w.sets||[];const last=w.sets[w.sets.length-1]||{weight:null,reps:null};

/* =====================================================================
   v7.5
   ・食事のジャンル分け（朝/昼/夜/間食）をやめ、時刻で扱う（不規則な勤務向け）
   ・食事の新規記録シート（写真が最上部・カメラ直起動・保存で自動分析）
   ・盤面に「今日の食事」タイル
   ===================================================================== */

function hhmm(ts){return ts?new Date(ts).toTimeString().slice(0,5):'';}
function mealTime(m){
  if(m&&m.ts)return hhmm(m.ts);
  /* 昔の記録は時刻を持っていないので、当時のジャンルを時刻の代わりに出す */
  return (m&&m.type)?m.type:'';
}
function tsFromTime(dateStr,tm){
  const d=new Date((dateStr||today())+'T00:00');
  const a=String(tm||'').split(':');
  d.setHours(+a[0]||0,+a[1]||0,0,0);
  return d.getTime();

/* ---------- コーチの一言：記号を落として結論だけ ---------- */
function plainFirst(txt,max){
  let s=String(txt||'')
    .replace(/^\s*(?:FOOD|DATA|MEMO|NOTE\[[^\]]*\])\s*[:：].*$/gmi,'')
    .replace(/^\s*#{1,4}.*$/gm,'')          /* 見出し行はまるごと落とす */
    .replace(/^\s*[-*+]\s+/gm,'')
    .replace(/\*\*/g,'').replace(/`/g,'')
    .replace(/\s+/g,' ').trim();
  if(!s)return '';
  max=max||78;
  /* まず「最初の一文」が収まるならそれだけ返す（途中で切れた文は読みにくい） */
  const one=s.match(/^[^。！？]*[。！？]/);
  if(one&&one[0].length<=max)return one[0];
  if(s.length<=max)return s;
  const cut=s.slice(0,max);
  const p=Math.max(cut.lastIndexOf('。'),cut.lastIndexOf('！'),cut.lastIndexOf('？'));
  return p>0?cut.slice(0,p+1):cut+'…';
}

/* ---------- ③ 今日のフィードバック ---------- */
/* 今日の記録を1つの文字列にする。中身が変わったかどうかの判定にも使う */
function fbToday(){
  const t=today();
  const ws=(D.workouts||[]).filter(w=>w.date===t);
  const rs=(D.runs||[]).filter(r=>r.date===t);
  const ms=(D.meals||[]).filter(m=>m.date===t).slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const so=(D.soreness||[]).filter(s=>s.date===t);
  const cd=(D.conditions||[]).find(c=>c.date===t);
  const mz=[...(D.measures||[])].reverse().find(x=>x.date<=t);
  const plan=D.plan&&D.plan.date===t?D.plan:null;
  const L=[];
  L.push('【目標の体型】'+((D.profile&&D.profile.goal)||'（未設定）'));
  if(mz){const parts=MFIELDS.filter(f=>mz[f[0]]!=null&&mz[f[0]]!=='').map(f=>f[1]+' '+mz[f[0]]+f[2]);
    if(parts.length)L.push('【直近の採寸('+fmtD(mz.date)+')】'+parts.join(' / '));}
  if(ws.length){
    L.push('【今日のトレ】'+ws.map(w=>w.name+' '+(w.sets||[]).map(s=>
      s.dur?s.dur:((s.weight!=null?s.weight+'kg':'')+(s.reps!=null?'×'+s.reps+'回':''))).join(' ')
      +(w.memo?'（'+w.memo+'）':'')).join(' ／ '));
    L.push('総ボリューム '+ws.reduce((a,w)=>a+wVol(w),0)+'kg');
  }else if(plan&&(plan.items||[]).length){
    L.push('【今日の予定のトレ（まだ終わっていない）】'+plan.items.map(x=>x.name).join('・'));
  }else L.push('【今日のトレ】まだ記録なし');
  if(rs.length)L.push('【ラン】'+rs.map(r=>(r.km||'?')+'km '+(r.min||'?')+'分').join(' / '));
  if(ms.length){
    L.push('【今日の食事】'+ms.map(m=>(mealTime(m)||'')+' '
      +((m.memo||'').trim()||aiFoodGuess(m)||'内容なし')
      +' '+mealKcal(m)+'kcal'+(mealHasNut(m)?'(P'+Math.round(+m.p||0)+')':'(推定)')).join(' ／ '));
    if(nutReady()){
      const inn=dayIntake(t),g=targetPFC(t);
      if(g)L.push('合計 '+Math.round(inn.k)+'kcal / 目標 '+g.k+'kcal、P '+Math.round(inn.p)+'g / 目標 '+g.p+'g'
        +(inn.est?`（うち数値が入っているのは ${inn.kM}kcal・P${inn.pM}g ぶんだけ。残りは推定なので当てにしすぎないこと）`:''));
    }
  }else L.push('【今日の食事】まだ記録なし');
  if(so.length)L.push('【筋肉痛】'+so.map(s=>(s.parts||[]).join('・')+(s.level?'('+s.level+')':'')).join(' / '));
  if(cd)L.push('【体調】'+(cd.mood||'')+(cd.period?' 生理あり':'')+(cd.memo?'（'+cd.memo+'）':''));
  return L.join('\n');
}

  return s.length+':'+h;
}

  if(!aiKey())return `<div class="muted">⚙設定でAPIキーを入れると、目標に対する今日のひとことが出ます</div>
    <button class="btn sm gray" style="width:100%;margin-top:8px" onclick="event.stopPropagation();openSettings()">設定をひらく</button>`;
  if(window._fbBusy)return `<div class="muted">今日の記録を見ています…</div>`;
  if(!f||f.date!==today()||(!f.text&&!f.err)){
    if(!fbHasEnough())return `<div class="muted">今日の記録が入るとコーチが見てくれます</div>`;
    return `<button class="btn" onclick="event.stopPropagation();makeFeedback(true)">今日を見てもらう</button>`;
  }
  if(f.err)return `<div class="muted">うまく取れませんでした（${esc(f.err).slice(0,40)}）</div>
    <button class="btn sm gray" style="width:100%;margin-top:8px" onclick="event.stopPropagation();makeFeedback(true)">もう一度</button>`;
  return `<div class="fbbody">${mdToHtml(f.text)}</div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:9px">
      <span class="muted" style="font-size:11px">${hhmm(f.ts)} 時点${fbStale()?'・記録が増えています':''}</span>
      <button class="minibtn" style="padding:6px 11px;font-size:12px"
        onclick="event.stopPropagation();makeFeedback(true)">${fbStale()?'更新':'見直す'}</button></div>`;
}
/* =====================================================================
   ★ 起動はここ（すべての定義が終わったあと）
   ここより上で render() を呼ぶと、まだ初期化されていない宣言に触れて
   ReferenceError になり、画面が描けなくなる（v7.3 で実際にやってしまった）
   ===================================================================== */
render();
goPage(0,false);
setTimeout(()=>goPage(0,false),60);
window.addEventListener('resize',()=>goPage(_page,false));
/* 今日ぶんのフィードバックが無ければ1回だけ作る（自動は1日1回まで） */
setTimeout(function(){try{fbAutoMaybe();}catch(e){}},900);
</script>
</body>
